name: Test node app

on:
  push:
    branch: ["test", "main"]

env:
  NODE_VERSION: '22'

jobs:
  test:
    strategy:
      runs-on: [ubuntu-latest]
      matrix:
        node-version: ["22", "20"]
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install node version
      if: github.ref_name == "test"
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install node version
      if: github.ref_name == "dev"
      uses: actions/setup-node@v7
      with:
        node-version: "22"
    
    - name: Run node test
      run: node add.js
